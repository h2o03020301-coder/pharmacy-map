<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>약국 입지 지도</title>
<style>
:root{--bg:#fff;--fg:#1f2d3a;--mut:#66727f;--card:#f3f5f7;--line:#d9dee3;--acc:#e06a45;--ph:#1f9d6b;--hs:#3b6fd4;--gy:#8a96a3;--mapbg:#e8ecef}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#13181d;--fg:#e8edf2;--mut:#98a3af;--card:#1d242c;--line:#33404b;--mapbg:#2a323a}}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{background:var(--bg);color:var(--fg);font-family:"Noto Sans KR","Apple SD Gothic Neo","Malgun Gothic",sans-serif;font-size:15px;line-height:1.5}
.app{display:grid;grid-template-columns:minmax(0,1fr) 430px;height:100%}
@media (max-width:820px){.app{grid-template-columns:1fr;grid-template-rows:54vh auto;height:auto}}
#mapwrap{position:relative;background:var(--mapbg);min-height:300px;overflow:hidden}
canvas#map{position:absolute;inset:0;width:100%;height:100%;touch-action:none;cursor:grab}
.zoom{position:absolute;right:12px;top:12px;display:grid;gap:6px}
.zoom button{width:40px;height:40px;font-size:22px;border-radius:10px;border:1px solid var(--line);background:var(--bg);color:var(--fg);cursor:pointer}
.legend{position:absolute;left:10px;bottom:24px;background:color-mix(in srgb,var(--bg) 90%,transparent);border:1px solid var(--line);border-radius:10px;padding:6px 10px;font-size:13px;display:flex;gap:12px;flex-wrap:wrap;max-width:calc(100% - 20px)}
.legend i{display:inline-block;width:11px;height:11px;border-radius:50%;margin-right:5px;vertical-align:-1px}
.attr{position:absolute;right:6px;bottom:3px;font-size:11px;color:var(--mut);background:color-mix(in srgb,var(--bg) 75%,transparent);padding:0 4px;border-radius:4px}
.hint{position:absolute;left:50%;top:14px;transform:translateX(-50%);background:var(--fg);color:var(--bg);padding:6px 14px;border-radius:999px;font-size:14px;pointer-events:none;white-space:nowrap}
aside{overflow-y:auto;padding:16px max(16px,env(safe-area-inset-right,0px)) 40px 16px;border-left:1px solid var(--line);display:grid;gap:14px;align-content:start}
@media (max-width:820px){aside{border-left:0;border-top:1px solid var(--line);overflow:visible}}
h1{margin:0;font-size:22px}
h1 small{display:block;font-size:13px;color:var(--mut);font-weight:400;margin-top:2px}
h2{margin:0 0 6px;font-size:16px}
.chips{display:flex;gap:8px;flex-wrap:wrap}
.chips button{font:inherit;font-size:14px;padding:6px 14px;border-radius:999px;border:1px solid var(--line);background:var(--bg);color:var(--fg);cursor:pointer}
.chips button.on{background:var(--acc);border-color:var(--acc);color:#fff}
.sec{background:var(--card);border-radius:14px;padding:12px 14px}
.kpis{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.kpi b{display:block;font-size:26px;font-variant-numeric:tabular-nums;line-height:1.15}
.kpi span{font-size:13px;color:var(--mut)}
.bar{display:grid;grid-template-columns:96px 1fr 36px;align-items:center;gap:8px;font-size:13px;margin:3px 0}
.bar div.t{height:8px;border-radius:4px;background:var(--line);overflow:hidden}
.bar div.t i{display:block;height:100%;background:var(--hs);border-radius:4px}
.bar.age div.t i{background:var(--acc)}
.bar span:last-child{text-align:right;font-variant-numeric:tabular-nums;color:var(--mut)}
.score{display:flex;align-items:baseline;gap:8px}
.score b{font-size:40px;font-variant-numeric:tabular-nums}
ul.list{margin:0;padding:0;list-style:none;font-size:14px}
ul.list li{display:flex;justify-content:space-between;gap:8px;padding:3px 0;border-bottom:1px dashed var(--line)}
ul.list li:last-child{border:0}
.mut{color:var(--mut);font-size:13px}
.w{display:grid;grid-template-columns:96px 1fr 30px;gap:8px;align-items:center;font-size:13px}
input[type=range]{width:100%;accent-color:var(--acc)}
.warn{font-size:12.5px;color:var(--mut)}
svg text{fill:var(--mut);font-size:10px}
</style></head><body>
<div class="app">
<div id="mapwrap"><canvas id="map"></canvas><div class="hint" id="hint">지도를 눌러 보세요</div>
<div class="zoom"><button id="zi" aria-label="확대">+</button><button id="zo" aria-label="축소">−</button></div>
<div class="legend"><span><i style="background:var(--ph)"></i>약국</span><span><i style="background:var(--hs)"></i>처방 관련 병·의원</span><span><i style="background:var(--gy)"></i>그 밖의 병·의원</span></div>
<div class="attr">지도 © OpenStreetMap contributors</div></div>
<aside>
<h1>약국 입지 지도<small>서대문 · 은평 · 마포 일대 · 공공데이터로 보는 주변 상권</small></h1>
<div class="chips" id="rad" role="group" aria-label="반경"></div>
<div id="out" class="sec"><div class="mut">지도에서 보고 싶은 자리를 누르면 그 주변의 약국, 병·의원, 인구를 보여줘요.</div></div>
<div class="warn">자료 기준: 상가(상권)정보 2026년 9월, 서울 생활인구 2026년 7월(내국인), 주민등록 인구 2026년 10월. 동 경계는 상가 위치로 근사한 값이라 경계 근처에서는 오차가 있어요. 참고 점수는 가정에 따른 계산이고 실제 개국 판단용이 아니에요.</div>
</aside></div>
